<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Patient Details</title>
</head>

<body>
    <div class="wrapper">
        <div class="title">
			<h1>Heart Disease Risk Level Predictor</h1>
			<p>Please fill this form with your correct and true details</p>
		</div>
    
        <form action="http://127.0.0.1:5000/getresults" method="POST">   
            <div class="form">

                <div class="inputfield">
                    <label for="name">Name</label>
                    <input class="input" type="text" name="name"  id="name" required>
                </div>

        		 <div class="inputfield">
                    <label for="age">Age</label>
                    <input class="input" type="text" name="age" cd  id="age" required>
                </div>
                
				<div class="inputfield">
                    <label for="tc">TC(mg/dL)</label>
                    <input class="input" type="text" name="tc"  id="tc" required>
                </div>
                <div class="inputfield">
                    <label for="hdl">HDL(mg/dL)</label>
                    <input class="input" type="text" name="hdl"  id="hdl" required>
                </div>
				
				<div class="inputfield">
                    <label for="gender">Gender</label>
                    <div class = "custom_select">
                        <select name="gender" id="gender" required>
                            <option value="" selected hidden>Select</option>
                            <option value="Female">Female</option>          
                            <option value="Male">Male</option>
                        </select>
                    </div>
                </div>
				<div class="inputfield">
                    <label for="smoke">Smoke</label>
                    <div class = "custom_select">
                        <select name="smoke" id="smoke" required>
                            <option value="" selected hidden>Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
				<div class="inputfield">
                    <label for="bpm">Blood Pressure Medication</label>
                    <div class = "custom_select">
                        <select name="bpm" id="bpm" required>
                            <option value="" selected hidden>Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
				<div class="inputfield">
                    <label for="diab">Diabetics</label>
                    <div class = "custom_select">
                        <select name="diab" id="diab" required>
                            <option value="" selected hidden>Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                
               <div class="inputfield">
                    <input class="btn" type="submit" value="Submit Details">
                </div>
            </div>

        </form>

</body>
</html>
